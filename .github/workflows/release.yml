name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure libs and download Traveler's Backpack
        run: |
          mkdir -p libs
          TARGET_JAR="libs/travelersbackpack-fabric-26.3-11.4.3.jar"
          if [ ! -f "$TARGET_JAR" ]; then
            echo "Fetching Traveler's Backpack 26.3-11.4.3 (Fabric) from Modrinth API..."
            DOWNLOAD_URL=$(curl -s "https://api.modrinth.com/v2/project/travelersbackpack/version" | jq -r '.[] | select(.version_number=="26.3-11.4.3" and (.loaders | contains(["fabric"]))) | .files[0].url')
            if [ -n "$DOWNLOAD_URL" ] && [ "$DOWNLOAD_URL" != "null" ]; then
              echo "Downloading from: $DOWNLOAD_URL"
              curl -sSL -o "$TARGET_JAR" "$DOWNLOAD_URL"
            else
              echo "::error::Could not resolve download URL for Traveler's Backpack from Modrinth API"
              exit 1
            fi
          fi
          ls -lh libs/

      - name: Build mod with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Read version properties
        id: vars
        run: |
          MOD_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.vars.outputs.version }}"
          name: "tbstackable v${{ steps.vars.outputs.version }}"
          files: "build/libs/tbstackable-fabric-${{ steps.vars.outputs.mc_version }}-${{ steps.vars.outputs.version }}.jar"
          draft: false
          prerelease: false
          generate_release_notes: true
